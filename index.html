<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardrobe Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;padding:1.5rem 1rem}
  .app{max-width:700px;margin:0 auto}
  h1{font-size:20px;font-weight:500;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
  .nav{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
  .nav button{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;cursor:pointer;transition:all .15s}
  .nav button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
  .section{display:none}.section.active{display:block}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
  label{font-size:13px;color:#666;display:block;margin-bottom:4px;margin-top:10px}
  label:first-child{margin-top:0}
  input,select{width:100%;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;outline:none}
  input:focus,select:focus{border-color:#888}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer;margin-top:14px;transition:opacity .15s}
  .btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .btn:hover{opacity:.8}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:100px;background:#f0f0ea;color:#555;margin-right:4px;margin-top:4px}
  .item-card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .item-name{font-size:14px;font-weight:500}
  .item-meta{font-size:12px;color:#888;margin-top:2px}
  .del{background:none;border:none;cursor:pointer;color:#bbb;font-size:16px;padding:2px 6px}
  .del:hover{color:#e24b4a}
  .empty{font-size:13px;color:#aaa;text-align:center;padding:2rem 0}
  .outfit-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px}
  .outfit-date{font-size:12px;color:#aaa;margin-bottom:4px}
  .outfit-occasion{font-size:15px;font-weight:500;margin-bottom:8px}
  .success{font-size:13px;color:#0f6e56;background:#e1f5ee;border-radius:8px;padding:6px 12px;margin-top:10px;display:none}
  .err{font-size:13px;color:#e24b4a;margin-top:8px;display:none}
  @media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <h1><i class="ti ti-hanger"></i> Wardrobe Assistant</h1>
  <div class="nav">
    <button class="active" onclick="show('add',this)"><i class="ti ti-plus"></i> Add Item</button>
    <button onclick="show('create',this)"><i class="ti ti-shirt"></i> Create Outfit</button>
    <button onclick="show('calendar',this)"><i class="ti ti-calendar"></i> Outfit Calendar</button>
    <button onclick="show('edit',this)"><i class="ti ti-edit"></i> Edit Outfit</button>
    <button onclick="show('items',this)"><i class="ti ti-list"></i> My Items</button>
  </div>

  <!-- ADD ITEM -->
  <div id="add" class="section active">
    <div class="card">
      <label>Item name</label>
      <input id="a-name" placeholder="e.g. White linen blouse">
      <div class="row">
        <div>
          <label>Type</label>
          <select id="a-type">
            <option>Top</option><option>Bottom</option><option>Hijab</option><option>Dress</option><option>Outerwear</option>
          </select>
        </div>
        <div>
          <label>Color</label>
          <input id="a-color" placeholder="e.g. White">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Material</label>
          <input id="a-material" placeholder="e.g. Linen">
        </div>
        <div>
          <label>Season</label>
          <select id="a-season">
            <option>All seasons</option><option>Spring</option><option>Summer</option><option>Autumn</option><option>Winter</option>
          </select>
        </div>
      </div>
      <label>Hijab compatible?</label>
      <select id="a-hijab">
        <option>Yes</option><option>No</option><option>N/A</option>
      </select>
      <br>
      <button class="btn btn-primary" onclick="addItem()"><i class="ti ti-plus"></i> Add to wardrobe</button>
      <div class="success" id="add-success">✓ Item added to your wardrobe!</div>
    </div>
  </div>

  <!-- CREATE OUTFIT -->
  <div id="create" class="section">
    <div class="card">
      <label>Occasion</label>
      <input id="c-occasion" placeholder="e.g. Work, Casual, Wedding">
      <label>Select top</label>
      <select id="c-top"></select>
      <label>Select bottom</label>
      <select id="c-bottom"></select>
      <label>Select hijab</label>
      <select id="c-hijab"></select>
      <br>
      <button class="btn btn-primary" onclick="createOutfit()"><i class="ti ti-check"></i> Save outfit</button>
      <div class="success" id="create-success">✓ Outfit saved!</div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div id="calendar" class="section">
    <div id="cal-list"></div>
  </div>

  <!-- EDIT OUTFIT -->
  <div id="edit" class="section">
    <div class="card">
      <label>Enter date to find outfit (yyyy-mm-dd)</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input id="e-date" placeholder="e.g. 2025-06-01" style="flex:1">
        <button class="btn" onclick="findOutfit()" style="margin-top:0"><i class="ti ti-search"></i> Find</button>
      </div>
      <div class="err" id="edit-not-found">No outfit found for that date.</div>
    </div>
    <div class="card" id="edit-form" style="display:none">
      <div id="edit-date-label" style="font-size:12px;color:#aaa;margin-bottom:8px"></div>
      <label>Occasion</label>
      <input id="e-occasion">
      <label>Top</label>
      <select id="e-top"></select>
      <label>Bottom</label>
      <select id="e-bottom"></select>
      <label>Hijab</label>
      <select id="e-hijab"></select>
      <br>
      <button class="btn btn-primary" onclick="saveEdit()"><i class="ti ti-device-floppy"></i> Save changes</button>
      <div class="success" id="edit-success">✓ Changes saved!</div>
    </div>
  </div>

  <!-- MY ITEMS -->
  <div id="items" class="section">
    <div id="items-list"></div>
  </div>
</div>

<script>
let wardrobe = JSON.parse(localStorage.getItem('wdrb_items')||'[]');
let outfits  = JSON.parse(localStorage.getItem('wdrb_outfits')||'[]');
let editIdx  = -1;

function save(){
  localStorage.setItem('wdrb_items', JSON.stringify(wardrobe));
  localStorage.setItem('wdrb_outfits', JSON.stringify(outfits));
}

function show(id, btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if(id==='create')   populateSelects();
  if(id==='calendar') renderCalendar();
  if(id==='items')    renderItems();
  if(id==='edit'){
    populateEditSelects();
    document.getElementById('edit-form').style.display='none';
    document.getElementById('edit-not-found').style.display='none';
  }
}

function flash(id){
  const el=document.getElementById(id);
  el.style.display='block';
  setTimeout(()=>el.style.display='none',2500);
}

function addItem(){
  const name=document.getElementById('a-name').value.trim();
  if(!name) return alert('Please enter an item name.');
  wardrobe.push({
    name,
    type:     document.getElementById('a-type').value,
    color:    document.getElementById('a-color').value,
    material: document.getElementById('a-material').value,
    season:   document.getElementById('a-season').value,
    hijab:    document.getElementById('a-hijab').value
  });
  save();
  document.getElementById('a-name').value='';
  document.getElementById('a-color').value='';
  document.getElementById('a-material').value='';
  flash('add-success');
}

function populateSelects(){
  const tops    = wardrobe.filter(i=>i.type==='Top'||i.type==='Dress');
  const bottoms = wardrobe.filter(i=>i.type==='Bottom'||i.type==='Dress');
  const hijabs  = wardrobe.filter(i=>i.type==='Hijab');
  function fill(id, arr){
    document.getElementById(id).innerHTML =
      '<option value="">— none —</option>' +
      arr.map(i=>`<option>${i.name}</option>`).join('');
  }
  fill('c-top',tops); fill('c-bottom',bottoms); fill('c-hijab',hijabs);
}

function createOutfit(){
  const occasion=document.getElementById('c-occasion').value.trim();
  if(!occasion) return alert('Please enter an occasion.');
  outfits.push({
    date:     new Date().toISOString().slice(0,10),
    occasion,
    top:      document.getElementById('c-top').value,
    bottom:   document.getElementById('c-bottom').value,
    hijab:    document.getElementById('c-hijab').value
  });
  save();
  flash('create-success');
}

function renderCalendar(){
  const el=document.getElementById('cal-list');
  if(!outfits.length){
    el.innerHTML='<div class="empty">No outfits yet — create one first!</div>';
    return;
  }
  const sorted=[...outfits].sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=sorted.map(o=>`
    <div class="outfit-card">
      <div class="outfit-date">📅 ${o.date}</div>
      <div class="outfit-occasion">${o.occasion}</div>
      <div>
        ${o.top    ? `<span class="tag">👕 ${o.top}</span>`   : ''}
        ${o.bottom ? `<span class="tag">👖 ${o.bottom}</span>` : ''}
        ${o.hijab  ? `<span class="tag">🧕 ${o.hijab}</span>`  : ''}
      </div>
    </div>`).join('');
}

function renderItems(){
  const el=document.getElementById('items-list');
  if(!wardrobe.length){
    el.innerHTML='<div class="empty">No items yet — add some!</div>';
    return;
  }
  el.innerHTML=wardrobe.map((it,i)=>`
    <div class="item-card">
      <div>
        <div class="item-name">${it.name}</div>
        <div class="item-meta">${it.type} · ${it.color||'—'} · ${it.material||'—'} · ${it.season} · Hijab compatible: ${it.hijab}</div>
      </div>
      <button class="del" onclick="deleteItem(${i})" title="Delete">🗑</button>
    </div>`).join('');
}

function deleteItem(i){
  if(confirm('Delete "'+wardrobe[i].name+'"?')){
    wardrobe.splice(i,1);
    save();
    renderItems();
  }
}

function populateEditSelects(){
  const tops    = wardrobe.filter(i=>i.type==='Top'||i.type==='Dress');
  const bottoms = wardrobe.filter(i=>i.type==='Bottom'||i.type==='Dress');
  const hijabs  = wardrobe.filter(i=>i.type==='Hijab');
  function fill(id, arr){
    document.getElementById(id).innerHTML =
      '<option value="">— none —</option>' +
      arr.map(i=>`<option>${i.name}</option>`).join('');
  }
  fill('e-top',tops); fill('e-bottom',bottoms); fill('e-hijab',hijabs);
}

function findOutfit(){
  const date=document.getElementById('e-date').value.trim();
  editIdx=outfits.findIndex(o=>o.date===date);
  const nf=document.getElementById('edit-not-found');
  const ef=document.getElementById('edit-form');
  if(editIdx===-1){ nf.style.display='block'; ef.style.display='none'; return; }
  nf.style.display='none';
  const o=outfits[editIdx];
  document.getElementById('edit-date-label').textContent='Editing outfit: '+o.date;
  document.getElementById('e-occasion').value=o.occasion;
  document.getElementById('e-top').value=o.top||'';
  document.getElementById('e-bottom').value=o.bottom||'';
  document.getElementById('e-hijab').value=o.hijab||'';
  ef.style.display='block';
}

function saveEdit(){
  if(editIdx===-1) return;
  outfits[editIdx]={
    ...outfits[editIdx],
    occasion: document.getElementById('e-occasion').value,
    top:      document.getElementById('e-top').value,
    bottom:   document.getElementById('e-bottom').value,
    hijab:    document.getElementById('e-hijab').value
  };
  save();
  flash('edit-success');
}
</script>
</body>
</html>
